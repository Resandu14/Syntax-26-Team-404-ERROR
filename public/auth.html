<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | CleanSpot</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260915-4">
    <link rel="icon" type="image/png" href="/assets/cleanspot-icon.png">
  </head>
  <body data-page="auth">
    <header class="auth-header">
      <a class="wordmark brand-identity" href="/index.html" aria-label="CleanSpot home"><span class="brand-symbol"><img src="/assets/cleanspot-icon.png" alt=""></span><strong>CleanSpot</strong></a>
    </header>
    <main class="auth-layout">
      <div class="auth-visual">
        <img src="/assets/auth-environment.png" alt="Peaceful green forest and lake with the quote Small actions. Greener tomorrows.">
      </div>
      <section class="auth-panel">
        <div class="auth-intro">
          <p class="eyebrow">Your community action hub</p>
          <h1 id="authTitle">Welcome back.</h1>
          <p id="authSubtitle">Sign in to follow reports, rewards, and reuse opportunities.</p>
        </div>
        <form id="authForm" class="form-stack" novalidate>
          <div id="authNameField" class="field hidden"><label for="authName">Your name</label><input id="authName" name="name" autocomplete="name" placeholder="Nimali Perera"></div>
          <div class="field"><label for="authEmail">Email address</label><input id="authEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div class="field password-form-field"><label for="authPassword">Password</label><div class="password-field"><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" title="Show password"><i data-lucide="eye"></i></button></div></div>
          <fieldset id="roleFields" class="field-set hidden">
            <legend>How will you use CleanSpot?</legend>
            <div class="role-options">
              <label class="role-option"><input type="radio" name="role" value="citizen" checked><span><i data-lucide="heart-handshake"></i><strong>Citizen</strong><small>Report issues and reuse materials.</small></span></label>
              <label class="role-option"><input type="radio" name="role" value="cleanup_company"><span><i data-lucide="truck"></i><strong>Cleanup company</strong><small>Respond to local cleanup work.</small></span></label>
            </div>
          </fieldset>
          <div id="companyFields" class="hidden two-fields">
            <div class="field"><label for="companyName">Company name</label><input id="companyName" name="companyName" placeholder="Green Route Services"></div>
            <div class="field"><label for="serviceArea">Service area</label><input id="serviceArea" name="serviceArea" placeholder="Colombo and suburbs"></div>
          </div>
          <p id="authMessage" class="form-message" aria-live="polite"></p>
          <button id="authSubmit" class="button button-primary button-full" type="submit">Sign in <i data-lucide="arrow-right"></i></button>
        </form>
        <p class="auth-switch" id="authSwitch">New to CleanSpot? <a href="/auth.html?mode=register">Create an account</a></p>
      </section>
    </main>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/app.js?v=20260916-auth-config"></script>
  </body>
</html>
