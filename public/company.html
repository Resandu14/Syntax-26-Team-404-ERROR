<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cleanup Console | CleanSpot</title><link rel="icon" type="image/png" href="/assets/cleanspot-icon.png"><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="company"><header id="topbar"></header><main class="app-main" id="pageContent"></main><dialog id="declineDialog" class="dialog"><form id="declineForm" method="dialog" class="form-stack"><div class="dialog-heading"><h2>Decline report</h2><button class="icon-button" type="button" data-close-dialog="declineDialog" aria-label="Close"><i data-lucide="x"></i></button></div><input type="hidden" id="declineReportId"><div class="field"><label for="declineReason">Reason</label><select id="declineReason"><option>Duplicate report</option><option>Too small / low priority</option><option>Already cleaned</option><option>Invalid report</option><option>Not a waste issue</option><option>Unsafe / inaccessible location</option><option>Outside service area</option><option>Other</option></select></div><div class="field hidden" id="otherDeclineWrap"><label for="otherDeclineReason">Explain the reason</label><textarea id="otherDeclineReason" rows="3" placeholder="Give the citizen a helpful reason."></textarea></div><button class="button button-danger" type="submit">Decline report</button></form></dialog><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/app.js"></script></body></html>
