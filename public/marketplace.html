<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Marketplace | CleanSpot</title><link rel="icon" type="image/png" href="/assets/cleanspot-icon.png"><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="marketplace"><header id="topbar"></header><main class="app-main" id="pageContent"></main><dialog id="listingDialog" class="dialog dialog-wide"><form id="listingForm" class="form-stack" novalidate><div class="dialog-heading"><div><p class="eyebrow">Marketplace</p><h2>Post a reusable item</h2></div><button class="icon-button" type="button" data-close-dialog="listingDialog" aria-label="Close"><i data-lucide="x"></i></button></div><div class="two-fields"><div class="field"><label for="listingTitle">Item name</label><input id="listingTitle" name="title" placeholder="100 clean cardboard boxes" required></div><div class="field"><label for="listingCategory">Category</label><select id="listingCategory" name="category" required><option>Cardboard</option><option>Plastic</option><option>Glass</option><option>Metal</option><option>Electronics</option><option>Furniture</option><option>Reusable Items</option><option>Other</option></select></div></div><div class="three-fields"><div class="field"><label for="listingQuantity">Quantity</label><input id="listingQuantity" name="quantity" placeholder="100 boxes" required></div><div class="field"><label for="listingType">Listing type</label><select id="listingType" name="listingType"><option value="individual">Individual</option><option value="bulk">Bulk</option></select></div><div class="field"><label for="listingCondition">Condition</label><input id="listingCondition" name="condition" placeholder="Clean, used once" required></div></div><div class="two-fields"><div class="field"><label for="listingPrice">Price (LKR)</label><input id="listingPrice" name="price" type="number" min="0" step="1" placeholder="2500" required></div><div class="field"><label for="listingLocation">Location</label><input id="listingLocation" name="location" placeholder="Nugegoda" required></div></div><div class="field"><label for="listingContact">Contact information</label><input id="listingContact" name="contactInfo" placeholder="Email or phone number" required></div><div class="field"><label for="listingDescription">Description</label><textarea id="listingDescription" name="description" rows="3" minlength="8" placeholder="Tell buyers what can be reused, collected, or recycled." required></textarea></div><div class="upload-area compact"><label for="listingPhotos"><i data-lucide="image-plus"></i><strong>Add listing photos</strong><span>At least one image required.</span></label><input id="listingPhotos" name="photos" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple required><div id="listingPreview" class="image-preview-grid"></div></div><p id="listingMessage" class="form-message" aria-live="polite"></p><button class="button button-primary" type="submit">Publish listing <i data-lucide="arrow-up-right"></i></button></form></dialog><dialog id="contactDialog" class="dialog"><div class="form-stack"><div class="dialog-heading"><h2>Contact seller</h2><button class="icon-button" type="button" data-close-dialog="contactDialog" aria-label="Close"><i data-lucide="x"></i></button></div><p id="contactDetails"></p><p class="muted">Arrange collection and payment directly with the seller. CleanSpot does not handle payments.</p></div></dialog><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/js/app.js?v=20260915-2"></script></body></html>
